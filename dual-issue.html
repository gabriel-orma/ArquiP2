<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procesador dual-issue in-order (E2)</title>
<style>:root{--bg:#ffffff;--ink:#111;--panel:#f6f6f4;--line:#d9d9d6;--muted:#666;--sel:#e53935;--selfill:#fdecea;--link:#1565c0;--ok:#2e7d32;--warn:#b26a00}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
#bar h1{font-size:14px;margin:0 6px 0 0;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:32vw}
#bar button,#bar input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;cursor:pointer}
#bar input[type=search]{width:170px;cursor:text}
#bar label{display:inline-flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap}
#bar .grp{display:inline-flex;align-items:center;gap:6px}
#zoomv{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
#status{font-weight:bold}#status.ok{color:var(--ok)}#status.bad{color:var(--sel)}
#live{color:var(--ok);display:none}
#hint{color:var(--muted);font-size:12px;margin-left:auto}
#stage{position:relative;flex:1;overflow:hidden;cursor:grab;touch-action:none}
#stage.panning{cursor:grabbing}
#stage svg{width:100%;height:100%;display:block;user-select:none}
.net,.module{cursor:pointer}
.hit{stroke:transparent;fill:none;stroke-width:12px;vector-effect:non-scaling-stroke;pointer-events:stroke}
.mhit{fill:transparent;stroke:none;pointer-events:all}
.net:hover path:not(.hit){stroke-width:2.4px}
.net.sel path:not(.hit){stroke:var(--sel)!important;stroke-width:2.6px}
.net.sel circle{fill:var(--sel)!important}
.module.sel path,.module.sel rect:not(.mhit),.module.sel circle{stroke:var(--sel)!important;stroke-width:1.9px}
.module.sel text{fill:var(--sel)!important}
.module.sel rect:not(.mhit),.module.sel path[fill]:not([fill=none]){fill:var(--selfill)}
.label.sel text{fill:var(--sel)!important;font-weight:bold}
svg.dim .net:not(.sel),svg.dim .module:not(.sel),svg.dim .label:not(.sel){opacity:.22}
.tag rect{fill:var(--sel);stroke:none}.tag text{fill:#fff;font-weight:bold}
#pop{position:fixed;z-index:10;min-width:240px;max-width:380px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}
#pop header{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:move;background:var(--bg);border-radius:8px 8px 0 0}
#pop header b{flex:1;color:var(--sel);font-size:14px}
#pop header button{border:0;background:none;color:var(--ink);font-size:16px;cursor:pointer;line-height:1}
#pop .kind{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
#pop table{border-collapse:collapse;width:100%;margin:4px 0}
#pop td{padding:2px 10px;vertical-align:top}#pop td:first-child{color:var(--muted);white-space:nowrap;width:1%}
#pop .info{padding:6px 10px;white-space:pre-wrap;border-top:1px solid var(--line)}
#pop .chips{display:flex;flex-wrap:wrap;gap:4px}#pop .chip{border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:11px}
.lnk{color:var(--link);cursor:pointer;text-decoration:underline dotted}
#issues{position:fixed;z-index:9;right:12px;top:48px;width:min(460px,90vw);max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none;padding:6px 0}
#issues div{padding:4px 12px;border-bottom:1px solid var(--line);cursor:pointer}#issues div:hover{background:var(--bg)}
#issues .sev-error{color:var(--sel)}#issues .sev-warning{color:var(--warn)}
#issues small{display:block;color:var(--muted)}
</style>
</head><body>
<div id="bar">
  <h1 title="Procesador dual-issue in-order (E2)">Procesador dual-issue in-order (E2)</h1>
  <span class="grp"><button id="zout" title="Alejar (-)">−</button><span id="zoomv">100%</span><button id="zin" title="Acercar (+)">+</button><button id="zfit" title="Ajustar (0)">Ajustar</button></span>
  <input id="q" type="search" list="ids" placeholder="Buscar señal o bloque…" aria-label="Buscar señal o bloque">
  <datalist id="ids"></datalist>
  <label title="Atenuar lo que no está seleccionado"><input id="dim" type="checkbox"> atenuar resto</label>
  <span class="grp" id="layers" title="Capas visibles"></span>
  <span id="status"></span><span id="live" title="Se recarga al guardar el YAML">● en vivo</span>
  <span id="hint">rueda: zoom · arrastrar: mover · clic: seleccionar · shift+clic: añadir · Esc: limpiar</span>
</div>

    if (!g) return;
    var r = document.createElementNS(NS, 'rect');
    r.setAttribute('class', 'mhit'); r.setAttribute('x', m.box[0]); r.setAttribute('y', m.box[1]);
    r.setAttribute('width', m.box[2]); r.setAttribute('height', m.box[3]);
    g.insertBefore(r, g.firstChild);
  });
  function cssq(s) { return (window.CSS && CSS.escape) ? CSS.escape(s) : s; }

  // ---------- selection
  var sel = { nets: {}, modules: {}, primary: null, at: null };
  function clearSel() { sel = { nets: {}, modules: {}, primary: null, at: null }; paint(); hidePop(); save(); }
  function selectNet(id, add, at) {
    var n = D.nets[id]; if (!n) return;
    if (!add) sel = { nets: {}, modules: {}, primary: null, at: null };
    sel.nets[id] = 'p';
    n.modules.forEach(function (m) { if (!sel.modules[m]) sel.modules[m] = 'c'; });
    sel.primary = { kind: 'net', id: id }; sel.at = at || null;
    paint(); save();
  }
  function selectModule(id, add) {
    var m = D.modules[id]; if (!m) return;
    if (!add) sel = { nets: {}, modules: {}, primary: null, at: null };
    sel.modules[id] = 'p';
    m.nets.forEach(function (n) { if (!sel.nets[n]) sel.nets[n] = 'c'; });
    sel.primary = { kind: 'module', id: id }; sel.at = null;
    paint(); save();
  }
  function paint() {
    Array.prototype.forEach.call(svg.querySelectorAll('.sel'), function (e) { e.classList.remove('sel'); });
    Object.keys(sel.nets).forEach(function (id) {
      Array.prototype.forEach.call(svg.querySelectorAll('[data-net="' + cssq(id) + '"]'), function (e) { e.classList.add('sel'); });
    });
    Object.keys(sel.modules).forEach(function (id) {
      Array.prototype.forEach.call(svg.querySelectorAll('[data-module="' + cssq(id) + '"]'), function (e) { e.classList.add('sel'); });
    });
    var any = Object.keys(sel.nets).length + Object.keys(sel.modules).length > 0;
    svg.classList.toggle('dim', any && document.getElementById('dim').checked);
    drawTags();
  }

  // ---------- name tags (signal names next to the selection)
  var tagLayer = document.createElementNS(NS, 'g'); tagLayer.setAttribute('id', 'hde-tags'); svg.appendChild(tagLayer);
  function addTag(x, y, text, anchorRight) {
    var s = vb.w / Math.max(1, svg.clientWidth); // svg units per screen px
    var fs = 11 * s, pad = 3 * s;
    var g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'tag');
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('font-size', fs); t.setAttribute('dominant-baseline', 'central'); t.textContent = text;
    var r = document.createElementNS(NS, 'rect'); r.setAttribute('rx', 3 * s);
    g.appendChild(r); g.appendChild(t); tagLayer.appendChild(g);
    var w = t.getComputedTextLength();
    var x0 = anchorRight ? x - w - 2 * pad - 4 * s : x + 4 * s;
    var y0 = y - fs * 0.75 - pad;
    t.setAttribute('x', x0 + pad); t.setAttribute('y', y0 + pad + fs * 0.62);
    r.setAttribute('x', x0); r.setAttribute('y', y0); r.setAttribute('width', w + 2 * pad); r.setAttribute('height', fs * 1.25 + pad);
  }
  function drawTags() {
    while (tagLayer.firstChild) tagLayer.removeChild(tagLayer.firstChild);
    if (!sel.primary) return;
    if (sel.primary.kind === 'net') {
      var n = D.nets[sel.primary.id];
      var p = sel.at || n.anchor;
      if (p) addTag(p[0], p[1] - 10 * vb.w / Math.max(1, svg.clientWidth), n.name, false);
    } else {
      var m = D.modules[sel.primary.id];
      m.ports.forEach(function (pt) {
        if (!pt.net || !visibleNet(pt.net)) return;
        var nm = D.nets[pt.net].name;
        if (pt.side === 'W') addTag(pt.x, pt.y, nm, true);
        else if (pt.side === 'E') addTag(pt.x, pt.y, nm, false);
        else if (pt.side === 'N') addTag(pt.x, pt.y - 8 * vb.w / Math.max(1, svg.clientWidth), nm, false);
        else addTag(pt.x, pt.y + 10 * vb.w / Math.max(1, svg.clientWidth), nm, false);
      });
    }
  }

  // ---------- click handling
  function onClick(e) {
    var add = e.shiftKey || e.ctrlKey || e.metaKey;
    var g = e.target.closest('[data-net]');
    if (g && !g.classList.contains('module')) {
      var p = toSvg(e.clientX, e.clientY);
      selectNet(g.getAttribute('data-net'), add, [p.x, p.y]); showPop('net', g.getAttribute('data-net'), e.clientX, e.clientY); return;
    }
    var mg = e.target.closest('[data-module]');
    if (mg) { selectModule(mg.getAttribute('data-module'), add); showPop('module', mg.getAttribute('data-module'), e.clientX, e.clientY); return; }
    if (!add) clearSel();
  }

  // ---------- floating details window
  var pop = document.getElementById('pop');
  function hidePop() { pop.style.display = 'none'; }
  function el(tag, cls, text) { var x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; }
  function link(kind, id, text) {
    var a = el('span', 'lnk', text || id);
    a.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var r = pop.getBoundingClientRect();
      if (kind === 'net') { selectNet(id, false); showPop('net', id, r.left, r.top, true); focusNet(id); }
      else { selectModule(id, false); showPop('module', id, r.left, r.top, true); focusModule(id); }
    });
    return a;
  }
  function row(tb, k, v) {
    var tr = el('tr'); tr.appendChild(el('td', null, k));
    var td = el('td'); if (typeof v === 'string' || typeof v === 'number') td.textContent = String(v); else td.appendChild(v);
    tr.appendChild(td); tb.appendChild(tr);
  }
  function endpoint(s) {
    var i = s.indexOf('.'); if (s.charAt(0) === '@') return link('net', s.slice(1), s);
    var span = el('span'); span.appendChild(link('module', s.slice(0, i), s.slice(0, i))); span.appendChild(document.createTextNode('.' + s.slice(i + 1).replace(/:(in|out)$/, ''))); return span;
  }
  function list(items) { var d = el('div'); items.forEach(function (x, k) { if (k) d.appendChild(document.createTextNode(', ')); d.appendChild(x); }); return d; }
  function extras(body, o) {
    if (o.tags && o.tags.length) { var c = el('div', 'chips'); o.tags.forEach(function (t) { c.appendChild(el('span', 'chip', t)); }); var tb0 = el('table'); row(tb0, 'tags', c); body.appendChild(tb0); }
    var mk = Object.keys(o.meta || {});
    if (mk.length) { var tb = el('table'); mk.forEach(function (k) { row(tb, k, String(o.meta[k])); }); body.appendChild(tb); }
    if (o.info) body.appendChild(el('div', 'info', o.info));
  }
  function showPop(kind, id, cx, cy, keep) {
    var body = document.getElementById('popbody'); body.innerHTML = '';
    var title = document.getElementById('poptitle'), kd = document.getElementById('popkind');
    var tb = el('table');
    if (kind === 'net') {
      var n = D.nets[id];
      title.textContent = n.name; kd.textContent = 'señal / cable';
      if (n.name !== n.id) row(tb, 'id', n.id);
      row(tb, 'clase', n.cls);
      row(tb, 'ancho', n.width + (n.width === 1 ? ' bit' : ' bits'));
      if (n.bits) row(tb, 'bits', '[' + n.bits + ']');
      row(tb, 'origen', endpoint(n.source));
      row(tb, n.sinks.length > 1 ? 'destinos' : 'destino', list(n.sinks.map(endpoint)));
      if (n.taps.length) row(tb, 'derivaciones', list(n.taps.map(function (t) { return link('net', t, D.nets[t].name); })));
      row(tb, 'bloques', list(n.modules.map(function (m) { return link('module', m); })));
      row(tb, 'ruta', n.routed ? (n.length + ' u, ' + n.bends + ' codos, ' + n.crossings + ' cruces') : 'SIN RUTEAR');
      body.appendChild(tb); extras(body, n);
    } else {
      var m = D.modules[id];
      title.textContent = m.label || m.id; kd.textContent = 'bloque · ' + m.type;
      if ((m.label || m.id) !== m.id) row(tb, 'id', m.id);
      if (m.stage) row(tb, 'etapa', m.stage);
      row(tb, 'posición', '[' + m.at.join(', ') + ']  tamaño [' + m.size.join(' × ') + ']');
      body.appendChild(tb);
      var ports = m.ports.filter(function (p) { return p.net; });
      if (ports.length) {
        var tp = el('table');
        ports.forEach(function (p) {
          var nm = D.nets[p.net];
          row(tp, p.name.replace(/:(in|out)$/, '') + (p.dir === 'out' ? ' →' : ' ←'), link('net', p.net, nm.name));
        });
        body.appendChild(el('div', 'kind', 'señales conectadas')).style.padding = '4px 10px 0';
        body.appendChild(tp);
      }
      extras(body, m);
    }
    pop.style.display = 'block';
    if (!keep) {
      var w = pop.offsetWidth, h = pop.offsetHeight;
      var x = cx + 16, y = cy + 16;
      if (x + w > innerWidth - 8) x = Math.max(8, cx - w - 16);
      if (y + h > innerHeight - 8) y = Math.max(8, innerHeight - h - 8);
      pop.style.left = x + 'px'; pop.style.top = y + 'px';
    }
  }
  document.getElementById('popclose').addEventListener('click', function () { clearSel(); });
  (function () { // drag the popup by its header
    var hd = pop.querySelector('header'), d = null;
    hd.addEventListener('pointerdown', function (e) { d = { x: e.clientX - pop.offsetLeft, y: e.clientY - pop.offsetTop }; hd.setPointerCapture(e.pointerId); });
    hd.addEventListener('pointermove', function (e) { if (d) { pop.style.left = (e.clientX - d.x) + 'px'; pop.style.top = (e.clientY - d.y) + 'px'; } });
    hd.addEventListener('pointerup', function () { d = null; });
  })();
  function focusNet(id) { var n = D.nets[id]; if (n.anchor) centerOn(n.anchor[0], n.anchor[1]); }
  function focusModule(id) { var m = D.modules[id]; centerOn(m.box[0] + m.box[2] / 2, m.box[1] + m.box[3] / 2); }

  // ---------- toolbar: zoom, dim, layers, search, issues
  document.getElementById('zin').onclick = function () { var r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.4); };
  document.getElementById('zout').onclick = function () { var r = stage.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.4); };
  document.getElementById('zfit').onclick = fit;
  document.getElementById('dim').onchange = function () { paint(); save(); };
  var hiddenLayers = {};
  function visibleNet(id) { return !hiddenLayers[D.nets[id].layer]; }
  var lay = document.getElementById('layers');
  D.layers.forEach(function (L) {
    var lb = el('label'); var cb = el('input'); cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = function () {
      hiddenLayers[L] = !cb.checked;
      Array.prototype.forEach.call(svg.querySelectorAll('.layer-' + cssq(L)), function (g) { g.style.display = cb.checked ? '' : 'none'; });
      drawTags(); save();
    };
    lb.appendChild(cb); lb.appendChild(document.createTextNode(L)); lay.appendChild(lb);
  });
  var q = document.getElementById('q'), dl = document.getElementById('ids');
  Object.keys(D.nets).forEach(function (id) { var o = el('option'); o.value = D.nets[id].name; dl.appendChild(o); if (D.nets[id].name !== id) { o = el('option'); o.value = id; dl.appendChild(o); } });
  Object.keys(D.modules).forEach(function (id) { var o = el('option'); o.value = id; dl.appendChild(o); });
  function findId(v) {
    if (D.nets[v]) return { kind: 'net', id: v };
    var byName = Object.keys(D.nets).filter(function (k) { return D.nets[k].name === v; })[0];
    if (byName) return { kind: 'net', id: byName };
    if (D.modules[v]) return { kind: 'module', id: v };
    var lv = v.toLowerCase();
    var n2 = Object.keys(D.nets).filter(function (k) { return k.toLowerCase() === lv || D.nets[k].name.toLowerCase() === lv; })[0];
    if (n2) return { kind: 'net', id: n2 };
    var m2 = Object.keys(D.modules).filter(function (k) { return k.toLowerCase() === lv; })[0];
    return m2 ? { kind: 'module', id: m2 } : null;
  }
  var lastSearch = '';
  function doSearch() {
    var v = q.value.trim(); if (!v || v === lastSearch) return;
    var f = findId(v); if (!f) { q.style.borderColor = 'var(--sel)'; return; }
    q.style.borderColor = ''; lastSearch = v;
    var r = stage.getBoundingClientRect();
    if (f.kind === 'net') { selectNet(f.id, false); focusNet(f.id); showPop('net', f.id, r.left + 20, r.top + 20); }
    else { selectModule(f.id, false); focusModule(f.id); showPop('module', f.id, r.left + 20, r.top + 20); }
  }
  q.addEventListener('keydown', function (e) { if (e.key === 'Enter') { lastSearch = ''; doSearch(); } });
  q.addEventListener('change', doSearch);
  q.addEventListener('input', function (e) { q.style.borderColor = ''; if (!e.inputType || e.inputType === 'insertReplacementText') doSearch(); });
  var st = document.getElementById('status'), iss = document.getElementById('issues');
  var errs = D.summary.errors;
  st.textContent = errs ? (errs + ' problema' + (errs > 1 ? 's' : '')) : 'OK · 0 colisiones';
  st.className = errs ? 'bad' : 'ok';
  st.title = D.summary.crossings + ' cruces · ' + D.summary.warnings + ' avisos';
  if (D.issues.length) {
    st.style.cursor = 'pointer'; st.style.textDecoration = 'underline dotted';
    st.onclick = function () { iss.style.display = iss.style.display === 'block' ? 'none' : 'block'; };
    D.issues.forEach(function (i) {
      var d = el('div', 'sev-' + i.severity); d.appendChild(document.createTextNode(i.code + ': ' + i.message));
      if (i.hint) d.appendChild(el('small', null, i.hint));
      d.onclick = function () {
        sel = { nets: {}, modules: {}, primary: null, at: null };
        (i.nets || []).forEach(function (n) { if (D.nets[n]) sel.nets[n] = 'p'; });
        (i.modules || []).forEach(function (m) { if (D.modules[m]) sel.modules[m] = 'p'; });
        paint();
        if (i.at) centerOn(i.at[0] * u, i.at[1] * u, 3);
      };
      iss.appendChild(d);
    });
  }
  window.addEventListener('keydown', function (e) {
    if (e.target === q) return;
    if (e.key === 'Escape') { clearSel(); iss.style.display = 'none'; }
    else if (e.key === '0' || e.key === 'f') fit();
    else if (e.key === '+' || e.key === '=') document.getElementById('zin').onclick();
    else if (e.key === '-') document.getElementById('zout').onclick();
  });

  // ---------- persistence (survives live reloads)
  var KEY = 'hde-view:' + D.title;
  function save() {
    try { sessionStorage.setItem(KEY, JSON.stringify({ vb: vb, primary: sel.primary, at: sel.at, dim: document.getElementById('dim').checked, hidden: hiddenLayers })); } catch (er) {}
  }
  try {
    var s = JSON.parse(sessionStorage.getItem(KEY) || 'null');
    if (s) {
      if (s.vb) vb = s.vb;
      document.getElementById('dim').checked = !!s.dim;
      Object.keys(s.hidden || {}).forEach(function (L) {
        if (!s.hidden[L]) return;
        Array.prototype.forEach.call(lay.querySelectorAll('label'), function (lb) { if (lb.textContent === L) { var cb = lb.querySelector('input'); cb.checked = false; cb.onchange(); } });
      });
      if (s.primary && s.primary.kind === 'net' && D.nets[s.primary.id]) selectNet(s.primary.id, false, s.at);
      if (s.primary && s.primary.kind === 'module' && D.modules[s.primary.id]) selectModule(s.primary.id, false);
    }
  } catch (er) {}
  applyVB();

  // ---------- live reload (hde view)
  if (window.HDE_LIVE && window.EventSource) {
    document.getElementById('live').style.display = 'inline';
    var es = new EventSource('/events');
    es.addEventListener('reload', function () { save(); location.reload(); });
  }
})();
</script>
</body></html>
