# Datapath COMPLETO del procesador superescalar dual-issue de 5 etapas + prediccion
# de saltos (Configuracion C). Dos vias (via0 = mas vieja, via1 = mas joven).
# Etapas: IF (fetch+prediccion) -> ID (decode+regfile+issue+forward) -> EX (2 ALU +
# branch + verificacion/actualizacion) -> MEM (1 puerto) -> WB (2 escrituras).
# Convencion Harris: clk/reset implicitos (no se dibujan).
version: 1
title: "Config C - Datapath dual-issue 5 etapas + predictor+BTB"
description: "Pipeline superescalar de 2 vias completo con Issue/Hazard unit, regfile 4R/2W, 2 ALU, forwarding, resolucion de branch por via, y el predictor de 2 bits + BTB integrado (prediccion en IF, verificacion y actualizacion en EX)."

settings:
  unit: 8
  margin: 6

stages:
  - { id: IF,  suffix: F, width: 104 }
  - { id: ID,  suffix: D, width: 112 }
  - { id: EX,  suffix: E, width: 100 }
  - { id: MEM, suffix: M, width: 36 }
  - { id: WB,  suffix: W, width: 26 }

modules:
  # ==================== IF: fetch ====================
  - { id: pcmux, type: mux4, stage: IF, at: [2, 52], sel: S,
      info: "Mux del PC siguiente. in0=PC+8 (secuencial 2 instr), in1=PC1D (reagrupamiento), in2=predTargetPkt (destino PREDICHO, NUEVO), in3=PCTargetE (PC correcto tras mala prediccion, NUEVO).",
      tags: [nuevo-C, fetch] }
  - { id: pc, type: flop, stage: IF, at: [8, 55], en: inverted, info: "Registro PC (PCF). Se congela (EN=0) en stall load-use.", tags: [fetch] }
  - id: imem2
    type: box
    stage: IF
    at: [14, 50]
    size: [11, 16]
    label: imem2
    info: "Memoria de instrucciones de 2 PUERTOS: trae la instruccion en PC (RD0) y la de PC+4 (RD1)."
    tags: [fetch]
    ports:
      A:   { side: W, at: 8,  dir: in }
      RD0: { side: E, at: 4,  dir: out }
      RD1: { side: E, at: 12, dir: out }
  - { id: k4, type: const, stage: IF, at: [9, 70], value: "4" }
  - { id: pcadd4, type: adder, stage: IF, at: [14, 68], info: "PCF+4: direccion de la via1 del paquete y 2a lectura de las tablas." }
  - { id: k8, type: const, stage: IF, at: [9, 82], value: "8" }
  - { id: pcadd8, type: adder, stage: IF, at: [14, 80], info: "PCF+8: avance secuencial de 2 instrucciones." }

  # ==================== IF: predictor + BTB ====================
  - id: btb
    type: box
    stage: IF
    at: [30, 10]
    size: [14, 24]
    label: "BTB"
    info: "Branch Target Buffer (directo). Lee con PCF y PCF+4 (hit/target por via); se escribe en EX al resolver un salto TOMADO. Da el DESTINO."
    tags: [nuevo-C, prediccion]
    ports:
      rPC0:    { side: W, at: 3,  dir: in }
      rPC1:    { side: W, at: 6,  dir: in }
      wPC:     { side: W, at: 14, dir: in }
      wTarget: { side: W, at: 17, dir: in }
      we:      { side: W, at: 20, dir: in }
      hit0:    { side: E, at: 4,  dir: out }
      target0: { side: E, at: 7,  dir: out }
      hit1:    { side: E, at: 15, dir: out }
      target1: { side: E, at: 18, dir: out }
  - id: bpred
    type: box
    stage: IF
    at: [30, 40]
    size: [14, 18]
    label: "predictor 2b"
    info: "Tabla de contadores saturados de 2 bits. Lee con PCF y PCF+4 (taken = MSB); se actualiza en EX en toda resolucion. Da TOMADO/no."
    tags: [nuevo-C, prediccion]
    ports:
      rPC0:   { side: W, at: 3,  dir: in }
      rPC1:   { side: W, at: 6,  dir: in }
      wPC:    { side: W, at: 10, dir: in }
      wTaken: { side: W, at: 13, dir: in }
      we:     { side: W, at: 16, dir: in }
      taken0: { side: E, at: 4,  dir: out }
      taken1: { side: E, at: 13, dir: out }
  - { id: andPT0, type: and, stage: IF, at: [50, 14], info: "predTaken0 = btb_hit0 & pred_t0.", tags: [nuevo-C, prediccion] }
  - { id: orPkt,  type: or,  stage: IF, at: [60, 10], info: "predTakenPkt = predTaken0 | predTaken1.", tags: [nuevo-C, prediccion] }
  - { id: notPT0, type: box, stage: IF, at: [50, 34], size: [6, 4], label: "NOT",
      ports: { in: { side: W, at: 2, dir: in }, out: { side: E, at: 2, dir: out } }, tags: [nuevo-C] }
  - { id: andPT1a, type: and, stage: IF, at: [50, 40], info: "btb_hit1 & pred_t1.", tags: [nuevo-C, prediccion] }
  - { id: andPT1,  type: and, stage: IF, at: [60, 42], info: "predTaken1 = (btb_hit1 & pred_t1) & ~predTaken0.", tags: [nuevo-C, prediccion] }
  - { id: muxTgt, type: mux2, stage: IF, at: [68, 24], sel: S, info: "predTargetPkt = predTaken0 ? btb_target0 : btb_target1.", tags: [nuevo-C, prediccion] }
  - id: pcselctl
    type: box
    stage: IF
    at: [50, 52]
    size: [14, 14]
    label: "sel PCnext"
    info: "Prioridad del PC siguiente: flushDE(mala pred) > stall > issueCount==1(reagrupa) > predTakenPkt(predice) > PC+8."
    tags: [nuevo-C, fetch]
    ports:
      flushDE:  { side: W, at: 2,  dir: in }
      stall:    { side: W, at: 5,  dir: in }
      issueCnt: { side: W, at: 8,  dir: in }
      predTk:   { side: W, at: 11, dir: in }
      out:      { side: S, at: 7,  dir: out }
  - { id: sqv1, type: box, stage: IF, at: [82, 10], size: [12, 4], label: "anula via1 (clrI1)",
      info: "predAnnul1 = predTaken0: si la via0 predijo salto, se limpia la via1 del paquete en IF/ID.",
      ports: { in: { side: W, at: 2, dir: in } }, tags: [nuevo-C] }

  - { id: ifid, type: pipereg, between: [IF, ID], clr: true, en: inverted,
      info: "Registro IF/ID (NUEVO en 5 etapas): lleva I0D/I1D, PC0/PC1 y la prediccion (predTaken0/1, predTarget0/1).", tags: [registro] }

  # ==================== ID: decode / regfile / issue / forward ====================
  - id: ctrl0
    type: control
    stage: ID
    at: [8, 8]
    label: "controller 0"
    info: "Decodifica la instruccion 0 (via0) y genera su control."
    tags: [via0, decode]
    ports: { op: { side: W, at: 5, dir: in } }
    outputs: [RegWrite, ResultSrc, MemWrite, Branch, Jump, ALUControl, ALUSrc, ImmSrc]
  - id: ctrl1
    type: control
    stage: ID
    at: [8, 104]
    label: "controller 1"
    info: "Decodifica la instruccion 1 (via1, la mas joven)."
    tags: [via1, decode]
    ports: { op: { side: W, at: 5, dir: in } }
    outputs: [RegWrite, ResultSrc, MemWrite, Branch, Jump, ALUControl, ALUSrc, ImmSrc]
  - { id: rf, type: regfile4r2w, stage: ID, at: [8, 40], info: "Register File 4R/2W: 4 lecturas (2 por via) y 2 escrituras por ciclo (flanco de bajada). Si las 2 vias escriben el mismo rd, gana la via1.", tags: [compartido] }
  - { id: ext0, type: extend, stage: ID, at: [30, 28], info: "Extensor de inmediato via0.", tags: [via0] }
  - { id: ext1, type: extend, stage: ID, at: [30, 92], info: "Extensor de inmediato via1.", tags: [via1] }
  # forwarding por operando: 5 fuentes (regfile, MEM via0, MEM via1, EX via0, EX via1)
  - id: fwdA0
    type: box
    stage: ID
    at: [50, 18]
    size: [10, 13]
    label: "fwd A0"
    info: "Forwarding operando A via0. 5 fuentes: in0=regfile, in1=MEM via0, in2=MEM via1, in3=EX via0, in4=EX via1. Prioridad EX1>EX0>MEM1>MEM0>regfile (sel ForwardA0, 3 bits)."
    tags: [via0, forwarding]
    ports:
      in0: { side: W, at: 2,  dir: in }
      in1: { side: W, at: 4,  dir: in }
      in2: { side: W, at: 6,  dir: in }
      in3: { side: W, at: 8,  dir: in }
      in4: { side: W, at: 10, dir: in }
      sel: { side: S, at: 5,  dir: in }
      out: { side: E, at: 6,  dir: out }
  - id: fwdB0
    type: box
    stage: ID
    at: [66, 34]
    size: [10, 13]
    label: "fwd B0"
    info: "Forwarding operando B (rs2/dato de store) via0. Mismas 5 fuentes."
    tags: [via0, forwarding]
    ports:
      in0: { side: W, at: 2,  dir: in }
      in1: { side: W, at: 4,  dir: in }
      in2: { side: W, at: 6,  dir: in }
      in3: { side: W, at: 8,  dir: in }
      in4: { side: W, at: 10, dir: in }
      sel: { side: S, at: 5,  dir: in }
      out: { side: E, at: 6,  dir: out }
  - id: fwdA1
    type: box
    stage: ID
    at: [50, 76]
    size: [10, 13]
    label: "fwd A1"
    info: "Forwarding operando A via1. Mismas 5 fuentes."
    tags: [via1, forwarding]
    ports:
      in0: { side: W, at: 2,  dir: in }
      in1: { side: W, at: 4,  dir: in }
      in2: { side: W, at: 6,  dir: in }
      in3: { side: W, at: 8,  dir: in }
      in4: { side: W, at: 10, dir: in }
      sel: { side: S, at: 5,  dir: in }
      out: { side: E, at: 6,  dir: out }
  - id: fwdB1
    type: box
    stage: ID
    at: [66, 92]
    size: [10, 13]
    label: "fwd B1"
    info: "Forwarding operando B (rs2/store) via1. Mismas 5 fuentes."
    tags: [via1, forwarding]
    ports:
      in0: { side: W, at: 2,  dir: in }
      in1: { side: W, at: 4,  dir: in }
      in2: { side: W, at: 6,  dir: in }
      in3: { side: W, at: 8,  dir: in }
      in4: { side: W, at: 10, dir: in }
      sel: { side: S, at: 5,  dir: in }
      out: { side: E, at: 6,  dir: out }
  # muxes de VALOR forwardeado (el resultado que escribira cada via en cada etapa)
  - { id: resEX0, type: mux2, stage: EX, at: [26, 54], sel: S, info: "fwdValE0 = resultado via0 en EX: ALUResult0E, o PC0+4 si es jal (sel ResultSrc0E).", tags: [via0, forwarding] }
  - { id: resEX1, type: mux2, stage: EX, at: [26, 122], sel: S, info: "fwdValE1 = resultado via1 en EX: ALUResult1E, o PC1+4 si es jal.", tags: [via1, forwarding] }
  - { id: resMEM0, type: mux3, stage: MEM, at: [24, 34], sel: S, info: "fwdValM0 = resultado via0 en MEM: ALUResult0M / ReadDataM (lw) / PC0+4 (jal), segun ResultSrc0M.", tags: [via0, forwarding] }
  - { id: resMEM1, type: mux3, stage: MEM, at: [24, 64], sel: S, info: "fwdValM1 = resultado via1 en MEM: ALUResult1M / ReadDataM / PC1+4.", tags: [via1, forwarding] }

  - { id: idex, type: pipereg, between: [ID, EX], clr: true, en: true,
      info: "Registro ID/EX: separa decode/issue/forward de EX. CLR mete burbuja (stall|flush); EN controla la via1 (issue1). Tambien lleva la prediccion a EX.", tags: [registro] }
  - { id: orFlushIF, type: or, stage: IF, at: [90, 118], info: "flushIFID = flushDE | (issueCount==1): limpia el registro IF/ID (mala prediccion o reagrupamiento).", tags: [control] }
  - { id: orClr,     type: or, stage: ID, at: [98, 118], info: "clear ID/EX = stall | flushDE: mete burbuja por stall load-use o por mala prediccion.", tags: [control] }

  # ==================== EX: 2 ALU + branch + prediccion ====================
  - { id: srcb0, type: mux2, stage: EX, at: [4, 26], info: "ALUSrc via0 (rs2 vs inmediato).", tags: [via0] }
  - { id: alu0,  type: alu,  stage: EX, at: [12, 20], info: "ALU via0.", tags: [via0] }
  - { id: pctadd0, type: adder, stage: EX, at: [12, 42], info: "PCTarget0E = PC0E + Imm0E (destino real via0).", tags: [via0, branch] }
  - { id: andg0, type: and, stage: EX, at: [26, 8],  info: "Branch0E & Zero0E.", tags: [via0, branch] }
  - { id: org0,  type: or,  stage: EX, at: [34, 6],  info: "PCSrc0E = (Branch0E & Zero0E) | Jump0E (la via0 realmente toma).", tags: [via0, branch] }
  - { id: orBr0, type: or,  stage: EX, at: [26, 14], info: "isBr0E = Branch0E | Jump0E (la via0 es un salto).", tags: [nuevo-C, via0] }
  - { id: srcb1, type: mux2, stage: EX, at: [4, 94], info: "ALUSrc via1.", tags: [via1] }
  - { id: alu1,  type: alu,  stage: EX, at: [12, 88], info: "ALU via1.", tags: [via1] }
  - { id: pctadd1, type: adder, stage: EX, at: [12, 110], info: "PCTarget1E = PC1E + Imm1E (destino real via1).", tags: [via1, branch] }
  - { id: andg1, type: and, stage: EX, at: [26, 100], info: "Branch1E & Zero1E.", tags: [via1, branch] }
  - { id: org1,  type: or,  stage: EX, at: [34, 98],  info: "PCSrc1E = (Branch1E & Zero1E) | Jump1E.", tags: [via1, branch] }
  - { id: orBr1, type: or,  stage: EX, at: [26, 106], info: "isBr1E = Branch1E | Jump1E.", tags: [nuevo-C, via1] }
  - id: verify
    type: box
    stage: EX
    at: [46, 18]
    size: [24, 40]
    label: "VERIFICACION"
    info: "Compara prediccion vs realidad. mispred = direccion equivocada O (tomado a otro destino). flushDE = mispred0|mispred1 (unico flush); PCTargetE = PC correcto; annul1 = PCSrc0E."
    tags: [nuevo-C, prediccion]
    ports:
      pt0:    { side: W, at: 2,  dir: in }
      pt1:    { side: W, at: 4,  dir: in }
      ptg0:   { side: W, at: 6,  dir: in }
      ptg1:   { side: W, at: 8,  dir: in }
      pc0:    { side: W, at: 11, dir: in }
      pc1:    { side: W, at: 13, dir: in }
      isbr0:  { side: W, at: 16, dir: in }
      isbr1:  { side: W, at: 18, dir: in }
      pcsrc0: { side: W, at: 21, dir: in }
      pcsrc1: { side: W, at: 23, dir: in }
      tgt0:   { side: W, at: 26, dir: in }
      tgt1:   { side: W, at: 28, dir: in }
      flushDE:   { side: N, at: 6,  dir: out }
      PCTargetE: { side: N, at: 14, dir: out }
      annul1:    { side: E, at: 36, dir: out }
  - id: update
    type: box
    stage: EX
    at: [46, 62]
    size: [24, 40]
    label: "ACTUALIZA BTB/PRED"
    info: "Al resolver un branch escribe las tablas. btb_we=(brRes0&PCSrc0E)|(brRes1&PCSrc1E) (inserta en tomado); pred_we=brRes0|brRes1 (siempre). wPC/wTgt/wTaken = la via que resolvio."
    tags: [nuevo-C, prediccion]
    ports:
      isbr0:  { side: W, at: 2,  dir: in }
      isbr1:  { side: W, at: 4,  dir: in }
      pcsrc0: { side: W, at: 7,  dir: in }
      pcsrc1: { side: W, at: 9,  dir: in }
      pc0:    { side: W, at: 13, dir: in }
      pc1:    { side: W, at: 15, dir: in }
      tgt0:   { side: W, at: 19, dir: in }
      tgt1:   { side: W, at: 21, dir: in }
      annul1: { side: W, at: 25, dir: in }
      btb_we:   { side: E, at: 3,  dir: out }
      btb_wPC:  { side: E, at: 7,  dir: out }
      btb_wTgt: { side: E, at: 11, dir: out }
      pred_we:  { side: E, at: 22, dir: out }
      pred_wPC: { side: E, at: 26, dir: out }
      pred_wTaken: { side: E, at: 30, dir: out }

  # anulacion de la via1 cuando la via0 toma el salto (annul1)
  - { id: notAnnul, type: box, stage: EX, at: [74, 70], size: [6, 4], label: "NOT",
      ports: { in: { side: W, at: 2, dir: in }, out: { side: E, at: 2, dir: out } }, tags: [via1, branch] }
  - { id: andRW1, type: and, stage: EX, at: [82, 66], info: "RegWrite1E_eff = RegWrite1E & ~annul1 (si la via0 salto, la via1 no escribe).", tags: [via1, branch] }
  - { id: andMW1, type: and, stage: EX, at: [82, 76], info: "MemWrite1E_eff = MemWrite1E & ~annul1.", tags: [via1, branch] }

  - { id: exmem, type: pipereg, between: [EX, MEM], info: "Registro EX/MEM: lleva las 2 vias a MEM.", tags: [registro] }

  # ==================== MEM: 1 puerto ====================
  - { id: selA,  type: mux2, stage: MEM, at: [3, 44], info: "Selector de direccion: la ALUResult de la via que accede a memoria (1 puerto).", tags: [memoria] }
  - { id: selWD, type: mux2, stage: MEM, at: [3, 56], info: "Selector del dato de store de la via con acceso a memoria.", tags: [memoria] }
  - { id: dmem,  type: dmem, stage: MEM, at: [12, 48], info: "Memoria de datos: UN puerto, compartido por las 2 vias.", tags: [memoria] }
  - { id: orMemW,   type: or, stage: MEM, at: [26, 78], info: "MemWriteM = MemWrite0M | MemWrite1M_eff: escribe en memoria si CUALQUIER via hace store.", tags: [memoria] }
  - { id: orMemOp1, type: or, stage: MEM, at: [26, 30], info: "memOp1 = MemWrite1M_eff | lw1: la via1 accede a memoria si hace store O load; selecciona la via del puerto unico.", tags: [memoria] }
  - { id: memwb, type: pipereg, between: [MEM, WB], info: "Registro MEM/WB.", tags: [registro] }

  # ==================== WB: 2 escrituras ====================
  - { id: resmux0, type: mux3, stage: WB, at: [6, 26], info: "Result mux via0 (ALU / ReadData / PC+4).", tags: [via0] }
  - { id: resmux1, type: mux3, stage: WB, at: [6, 92], info: "Result mux via1.", tags: [via1] }

  # ==================== Issue / Hazard unit ====================
  - id: hz
    type: hazard
    span: [IF, WB]
    at: [2, 162]
    size: [30, 8]
    label: "ISSUE / HAZARD UNIT"
    info: "Decide cuantas instrucciones emitir (2/1/0) respetando el orden, calcula forwarding de las 2 vias, el stall load-use y el issue1. Entrega stall/issueCount al selector de PC."
    tags: [compartido]
    top: [Instr0D, Instr1D, RegWrite0D,
          ForwardA0, ForwardB0, ForwardA1, ForwardB1,
          issue1, stall, issueCnt, RegWrite0M, Rd0M, RegWrite1M, Rd1M]

nets:
  # ---------- fetch / PC ----------
  - { id: PCnext, from: pcmux.out, to: pc.D, label: false }
  - { id: PC0, from: pc.Q, through: [ifid, idex],
      to: { F: [imem2.A, pcadd4.A, pcadd8.A, btb.rPC0, bpred.rPC0], E: [pctadd0.A, verify.pc0, update.pc0] },
      label: PCF, info: "PCF: alimenta imem2, los sumadores y las tablas; se acarrea como PC0 para verificar/actualizar en EX." }
  - { id: k4w, from: k4.out, to: pcadd4.B, label: false }
  - { id: PCF4, from: pcadd4.Y, through: [ifid, idex, exmem, memwb],
      to: { F: [btb.rPC1, bpred.rPC1], D: pcmux.in1, E: [pctadd1.A, verify.pc1, update.pc1], W: resmux0.in2 },
      label: "PCF+4", info: "PCF+4: 2a lectura de las tablas; registrado es PC1D (reagrupa) y PC1E (verifica); tambien es el enlace de jal de la via0 (PC0+4)." }
  - { id: k8w, from: k8.out, to: pcadd8.B, label: false }
  - { id: PCp8, from: pcadd8.Y, through: [ifid, idex, exmem, memwb],
      to: { F: pcmux.in0, W: resmux1.in2 },
      label: "PC+8", info: "PC+8: avance secuencial (pcmux.in0) y enlace de jal de la via1 (PC1+4 = PCF+8)." }

  # ---------- instrucciones (imem2 -> IF/ID -> decode) ----------
  - { id: Instr0, from: imem2.RD0, through: [ifid], to: { D: [ctrl0.op, rf.A1, rf.A2, ext0.in] }, label: Instr0F, info: "Instruccion 0 (via0): a controller0, regfile (Rs1/Rs2) y extend." }
  - { id: Instr1, from: imem2.RD1, through: [ifid], to: { D: [ctrl1.op, rf.A3, rf.A4, ext1.in] }, label: Instr1F, info: "Instruccion 1 (via1)." }

  # instrucciones completas al issue/hazard (extrae Rs1/Rs2/Rd internamente)
  - { id: Instr0toHz, class: hazard, from: "@Instr0D", to: hz.Instr0D, label: false }
  - { id: Instr1toHz, class: hazard, from: "@Instr1D", to: hz.Instr1D, label: false }
  # rd (campo 11:7) para la direccion de escritura del regfile y el forwarding
  - { id: Rd0, class: data, width: 5, from: "@Instr0D", to: [rf.A5, hz.Rd0M], label: false }
  - { id: Rd1, class: data, width: 5, from: "@Instr1D", to: [rf.A6, hz.Rd1M], label: false }

  # ---------- salidas de las tablas ----------
  - { id: btb_hit0, class: control, from: btb.hit0, to: andPT0.a, label: btb_hit0 }
  - { id: pred_t0,  class: control, from: bpred.taken0, to: andPT0.b, label: pred_t0 }
  - { id: btb_hit1, class: control, from: btb.hit1, to: andPT1a.a, label: btb_hit1 }
  - { id: pred_t1,  class: control, from: bpred.taken1, to: andPT1a.b, label: pred_t1 }
  - { id: btb_tgt0, from: btb.target0, through: [ifid, idex], to: { F: muxTgt.in1, E: verify.ptg0 }, label: btb_tgt0, labels: { E: false } }
  - { id: btb_tgt1, from: btb.target1, through: [ifid, idex], to: { F: muxTgt.in0, E: verify.ptg1 }, label: btb_tgt1, labels: { E: false } }

  # ---------- logica de prediccion (IF) ----------
  - { id: predTaken0, class: control, from: andPT0.y, through: [ifid, idex], y: { ifid: 20 },
      to: { F: [orPkt.a, muxTgt.sel, notPT0.in, sqv1.in], E: verify.pt0 }, label: predTaken0, labels: { E: false } }
  - { id: notPT0w, class: control, from: notPT0.out, to: andPT1.b, label: "~predTaken0" }
  - { id: andPT1aw, class: control, from: andPT1a.y, to: andPT1.a, label: false }
  - { id: predTaken1, class: control, from: andPT1.y, through: [ifid, idex], to: { F: orPkt.b, E: verify.pt1 }, label: predTaken1 }
  - { id: predTakenPkt, class: control, from: orPkt.y, to: pcselctl.predTk, label: predTakenPkt }
  - { id: predTargetPkt, from: muxTgt.out, to: pcmux.in2, label: predTargetPkt }

  # ---------- seleccion del PC siguiente ----------
  - { id: PCsel, class: control, from: pcselctl.out, to: pcmux.sel, label: PCsel }

  # ---------- regfile reads -> forward muxes ----------
  - { id: RD1_0, from: rf.RD1, to: fwdA0.in0, label: RD1_0D }
  - { id: RD2_0, from: rf.RD2, to: fwdB0.in0, label: RD2_0D }
  - { id: RD3_1, from: rf.RD3, to: fwdA1.in0, label: RD1_1D }
  - { id: RD4_1, from: rf.RD4, to: fwdB1.in0, label: RD2_1D }

  # ---------- muxes de valor forwardeado (entradas) ----------
  - { id: rEX0_alu, from: "@ALUResult0E", to: resEX0.in0, label: false }
  - { id: rEX0_pc4, from: "@PCF4E", to: resEX0.in1, label: false }
  - { id: rEX0_sel, class: control, width: 2, from: "@ResultSrc0E", to: resEX0.sel, label: false }
  - { id: rEX1_alu, from: "@ALUResult1E", to: resEX1.in0, label: false }
  - { id: rEX1_pc4, from: "@PCp8E", to: resEX1.in1, label: false }
  - { id: rEX1_sel, class: control, width: 2, from: "@ResultSrc1E", to: resEX1.sel, label: false }
  - { id: rMEM0_alu, from: "@ALUResult0M", to: resMEM0.in0, label: false }
  - { id: rMEM0_rd,  from: "@ReadDataM",   to: resMEM0.in1, label: false }
  - { id: rMEM0_pc4, from: "@PCF4M",       to: resMEM0.in2, label: false }
  - { id: rMEM0_sel, class: control, width: 2, from: "@ResultSrc0M", to: resMEM0.sel, label: false }
  - { id: rMEM1_alu, from: "@ALUResult1M", to: resMEM1.in0, label: false }
  - { id: rMEM1_rd,  from: "@ReadDataM",   to: resMEM1.in1, label: false }
  - { id: rMEM1_pc4, from: "@PCp8M",       to: resMEM1.in2, label: false }
  - { id: rMEM1_sel, class: control, width: 2, from: "@ResultSrc1M", to: resMEM1.sel, label: false }

  # ---------- 5 fuentes de forwarding hacia cada operando ----------
  - { id: fwdValM0, class: forward, from: resMEM0.out, to: [fwdA0.in1, fwdB0.in1, fwdA1.in1, fwdB1.in1], label: "fwd MEM0" }
  - { id: fwdValM1, class: forward, from: resMEM1.out, to: [fwdA0.in2, fwdB0.in2, fwdA1.in2, fwdB1.in2], label: "fwd MEM1" }
  - { id: fwdValE0, class: forward, from: resEX0.out,  to: [fwdA0.in3, fwdB0.in3, fwdA1.in3, fwdB1.in3], label: "fwd EX0" }
  - { id: fwdValE1, class: forward, from: resEX1.out,  to: [fwdA0.in4, fwdB0.in4, fwdA1.in4, fwdB1.in4], label: "fwd EX1" }
  - { id: FA0, class: hazard, width: 3, from: hz.ForwardA0, to: fwdA0.sel, label: false }
  - { id: FB0, class: hazard, width: 3, from: hz.ForwardB0, to: fwdB0.sel, label: false }
  - { id: FA1, class: hazard, width: 3, from: hz.ForwardA1, to: fwdA1.sel, label: false }
  - { id: FB1, class: hazard, width: 3, from: hz.ForwardB1, to: fwdB1.sel, label: false }

  # ---------- via0 datapath (ID -> EX) ----------
  - { id: SrcA0, from: fwdA0.out, through: [idex], to: { E: alu0.A }, label: false }
  - { id: WriteData0, from: fwdB0.out, through: [idex, exmem], to: { E: srcb0.in0, M: selWD.in0 }, label: Data2_0D, labels: { M: false } }
  - { id: Imm0, from: ext0.out, through: [idex], to: { E: [srcb0.in1, pctadd0.B] }, label: ImmExt0 }
  - { id: SrcB0, from: srcb0.out, to: alu0.B, label: false }
  - { id: SrcA1, from: fwdA1.out, through: [idex], to: { E: alu1.A }, label: false }
  - { id: WriteData1, from: fwdB1.out, through: [idex, exmem], to: { E: srcb1.in0, M: selWD.in1 }, label: false }
  - { id: Imm1, from: ext1.out, through: [idex], to: { E: [srcb1.in1, pctadd1.B] }, label: false }
  - { id: SrcB1, from: srcb1.out, to: alu1.B, label: false }

  # ---------- control via0 ----------
  - { id: RegWrite0, class: control, from: ctrl0.RegWrite, through: [idex, exmem, memwb], to: { M: hz.RegWrite0M, W: rf.WE5 } }
  - { id: ResultSrc0, class: control, width: 2, from: ctrl0.ResultSrc, through: [idex, exmem, memwb], to: { W: resmux0.sel }, label: "ResultSrc0{s}" }
  - { id: MemWrite0, class: control, from: ctrl0.MemWrite, through: [idex, exmem], to: { M: orMemW.a }, label: "MemWrite0{s}" }
  - { id: MemWrite1, class: control, from: ctrl1.MemWrite, through: [idex], to: { E: andMW1.a }, label: "MemWrite1{s}" }
  - { id: MemWrite1eff, class: control, from: andMW1.y, through: [exmem], to: { M: [orMemW.b, orMemOp1.a] }, label: "MemWrite1_eff" }
  - { id: MemWriteM, class: control, from: orMemW.y, to: dmem.WE, label: MemWriteM }
  - { id: lw1, class: control, from: "@ResultSrc1M", bits: "0", to: orMemOp1.b, label: "lw1" }
  - { id: memOp1, class: control, from: orMemOp1.y, to: [selA.sel, selWD.sel], label: memOp1 }
  - { id: Branch0, class: control, from: ctrl0.Branch, through: [idex], to: { E: [andg0.a, orBr0.a] } }
  - { id: Jump0, class: control, from: ctrl0.Jump, through: [idex], to: { E: [org0.a, orBr0.b] } }
  - { id: ALUControl0, class: control, width: 3, from: ctrl0.ALUControl, through: [idex], to: { E: alu0.ctrl }, label: false }
  - { id: ALUSrc0, class: control, from: ctrl0.ALUSrc, through: [idex], to: { E: srcb0.sel }, label: false }
  - { id: ImmSrc0, class: control, width: 2, from: ctrl0.ImmSrc, to: ext0.src, label: "ImmSrc0D" }

  # ---------- control via1 ----------
  - { id: RegWrite1, class: control, from: ctrl1.RegWrite, through: [idex], to: { E: andRW1.a }, label: "RegWrite1" }
  - { id: RegWrite1eff, class: control, from: andRW1.y, through: [exmem, memwb], to: { M: hz.RegWrite1M, W: rf.WE6 }, label: false }
  - { id: ResultSrc1, class: control, width: 2, from: ctrl1.ResultSrc, through: [idex, exmem, memwb], to: { W: resmux1.sel }, label: "ResultSrc1{s}" }
  - { id: Branch1, class: control, from: ctrl1.Branch, through: [idex], to: { E: [andg1.a, orBr1.a] } }
  - { id: Jump1, class: control, from: ctrl1.Jump, through: [idex], to: { E: [org1.a, orBr1.b] } }
  - { id: ALUControl1, class: control, width: 3, from: ctrl1.ALUControl, through: [idex], to: { E: alu1.ctrl }, label: "ALUControl1{s}" }
  - { id: ALUSrc1, class: control, from: ctrl1.ALUSrc, through: [idex], to: { E: srcb1.sel }, label: false }
  - { id: ImmSrc1, class: control, width: 2, from: ctrl1.ImmSrc, to: ext1.src, label: "ImmSrc1D" }

  # ---------- branch / PCSrc / isBr por via ----------
  - { id: Zero0, class: control, from: alu0.Zero, to: andg0.b, label: Zero0E }
  - { id: Bt0, class: control, from: andg0.y, to: org0.b, label: false }
  - { id: PCSrc0, class: control, from: org0.y, to: [verify.pcsrc0, update.pcsrc0], label: PCSrc0E }
  - { id: isBr0, class: control, from: orBr0.y, to: [verify.isbr0, update.isbr0], label: isBr0E }
  - { id: Zero1, class: control, from: alu1.Zero, to: andg1.b, label: Zero1E }
  - { id: Bt1, class: control, from: andg1.y, to: org1.b, label: false }
  - { id: PCSrc1, class: control, from: org1.y, to: [verify.pcsrc1, update.pcsrc1], label: PCSrc1E }
  - { id: isBr1, class: control, from: orBr1.y, to: [verify.isbr1, update.isbr1], label: isBr1E }
  - { id: PCTarget0, from: pctadd0.Y, to: [verify.tgt0, update.tgt0], label: PCTarget0E }
  - { id: PCTarget1, from: pctadd1.Y, to: [verify.tgt1, update.tgt1], label: PCTarget1E }

  # ---------- salidas de verificacion (realimentacion) ----------
  - { id: flushDE, class: feedback, from: verify.flushDE, to: [pcselctl.flushDE, orClr.b, orFlushIF.a], label: flushDE, info: "Mala prediccion: unico caso que hace flush (IF/ID y ID/EX) y redirige el PC." }
  - { id: PCTargetE, class: feedback, from: verify.PCTargetE, to: pcmux.in3, label: PCTargetE }
  - { id: annul1, class: control, from: verify.annul1, to: [update.annul1, notAnnul.in], label: annul1 }
  - { id: notAnnulw, class: control, from: notAnnul.out, to: [andRW1.b, andMW1.b], label: "~annul1" }

  # ---------- actualizacion de las tablas (realimentacion) ----------
  - { id: btb_we,   class: feedback, from: update.btb_we,   to: btb.we,      label: btb_we }
  - { id: btb_wPC,  class: feedback, from: update.btb_wPC,  to: btb.wPC,     label: btb_wPC }
  - { id: btb_wTgt, class: feedback, from: update.btb_wTgt, to: btb.wTarget, label: btb_wTgt }
  - { id: pred_we,  class: feedback, from: update.pred_we,  to: bpred.we,    label: pred_we }
  - { id: pred_wPC, class: feedback, from: update.pred_wPC, to: bpred.wPC,   label: pred_wPC }
  - { id: pred_wTaken, class: feedback, from: update.pred_wTaken, to: bpred.wTaken, label: pred_wTaken }

  # ---------- ALU results -> EX/MEM/WB ----------
  - { id: ALUResult0, from: alu0.Result, through: [exmem, memwb], y: { memwb: 48 }, to: { M: selA.in0, W: resmux0.in0 }, label: ALUResult0 }
  - { id: ALUResult1, from: alu1.Result, through: [exmem, memwb], y: { memwb: 92 }, to: { M: selA.in1, W: resmux1.in0 }, label: ALUResult1, labels: { W: false } }

  # ---------- memory (1 puerto) ----------
  - { id: DataAdr, from: selA.out, to: dmem.A, label: false }
  - { id: DataWD,  from: selWD.out, to: dmem.WD, label: false }
  - { id: ReadData, from: dmem.RD, through: [memwb], to: { W: [resmux0.in1, resmux1.in1] }, label: false }

  # ---------- writeback a regfile (2 puertos) ----------
  - { id: Result0, class: feedback, from: resmux0.out, to: rf.WD5, label: Result0W }
  - { id: Result1, class: feedback, from: resmux1.out, to: rf.WD6, label: Result1W }

  # ---------- hazard / issue outputs ----------
  - { id: RegWrite0toHz, class: hazard, from: "@RegWrite0D", to: hz.RegWrite0D, label: false }
  - { id: Stall, class: hazard, from: hz.stall, to: [pc.EN, ifid.EN, pcselctl.stall, orClr.a], label: stall, info: "Stall load-use: congela PC e IF/ID, mete burbuja en ID/EX y avisa al selector de PC." }
  - { id: IssueCnt, class: hazard, from: hz.issueCnt, to: [pcselctl.issueCnt, orFlushIF.b], label: "issueCnt==1" }
  - { id: Issue1, class: hazard, from: hz.issue1, to: idex.EN, label: false, info: "issue1: habilita la via1; si 0, solo se emite la via0 y la via1 se reagrupa." }
  - { id: ifidClr, class: control, from: orFlushIF.y, to: ifid.CLR, label: false }
  - { id: idexClr, class: control, from: orClr.y, to: idex.CLR, label: false }
