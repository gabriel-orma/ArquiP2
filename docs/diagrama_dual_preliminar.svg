<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="24" y="30" font-size="16" font-weight="600" fill="#22211d">Datapath Dual-Issue preliminar (E1)</text>

  <!-- caja punteada: lo que se duplica en E1 -->
  <rect x="16" y="70" width="372" height="210" rx="10" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="24" y="90" font-size="12" fill="#0F6E56">Se duplica en E1 (fetch + decode)</text>

  <!-- PC -->
  <rect x="26" y="150" width="70" height="52" rx="6" fill="#F1EFE8" stroke="#5f5e5a"/>
  <text x="61" y="172" font-size="13" fill="#2c2c2a" text-anchor="middle">PC</text>
  <text x="61" y="190" font-size="11" fill="#5f5e5a" text-anchor="middle">+8</text>

  <!-- imem2 -->
  <line x1="96" y1="176" x2="116" y2="176" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <rect x="118" y="150" width="110" height="52" rx="6" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="173" y="172" font-size="13" fill="#0C447C" text-anchor="middle">imem2</text>
  <text x="173" y="190" font-size="11" fill="#185FA5" text-anchor="middle">2 puertos</text>

  <!-- decodes -->
  <path d="M228 162 L242 162 L242 112 L256 112" fill="none" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <path d="M228 190 L242 190 L242 240 L256 240" fill="none" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <rect x="258" y="90" width="124" height="44" rx="6" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="320" y="113" font-size="12" fill="#0F6E56" text-anchor="middle">Decode 0 (controller)</text>
  <rect x="258" y="218" width="124" height="44" rx="6" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="320" y="241" font-size="12" fill="#0F6E56" text-anchor="middle">Decode 1 (controller)</text>

  <!-- issue unit (E2) -->
  <path d="M382 112 L398 112 L398 150 L410 150" fill="none" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <path d="M382 240 L398 240 L398 196 L410 196" fill="none" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <rect x="412" y="146" width="104" height="54" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-dasharray="5 4"/>
  <text x="464" y="170" font-size="12" fill="#A32D2D" text-anchor="middle">Issue Unit</text>
  <text x="464" y="187" font-size="11" fill="#A32D2D" text-anchor="middle">(E2)</text>

  <!-- ALUs -->
  <path d="M516 158 L528 158 L528 112 L540 112" fill="none" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <path d="M516 188 L528 188 L528 240 L540 240" fill="none" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <rect x="542" y="90" width="78" height="44" rx="6" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="581" y="117" font-size="13" fill="#0C447C" text-anchor="middle">ALU 0</text>
  <rect x="542" y="218" width="78" height="44" rx="6" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="581" y="245" font-size="13" fill="#0C447C" text-anchor="middle">ALU 1</text>

  <!-- dmem unico -->
  <path d="M620 112 L634 112 L634 150 L646 150" fill="none" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <path d="M620 240 L634 240 L634 196 L646 196" fill="none" stroke="#5f5e5a" marker-end="url(#ar)"/>
  <rect x="648" y="146" width="92" height="54" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="694" y="168" font-size="12" fill="#854F0B" text-anchor="middle">dmem</text>
  <text x="694" y="186" font-size="11" fill="#854F0B" text-anchor="middle">1 puerto (único)</text>

  <!-- regfile 4R/2W E2 -->
  <rect x="258" y="300" width="258" height="46" rx="6" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="387" y="328" font-size="12" fill="#A32D2D" text-anchor="middle">register file 4R / 2W  (E2)</text>

  <!-- leyenda -->
  <rect x="26" y="372" width="16" height="12" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="48" y="382" font-size="11" fill="#2c2c2a">Se duplica en E1</text>
  <rect x="176" y="372" width="16" height="12" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="198" y="382" font-size="11" fill="#2c2c2a">Es E2 (difícil)</text>
  <rect x="306" y="372" width="16" height="12" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="328" y="382" font-size="11" fill="#2c2c2a">Recurso único (no se duplica)</text>
</svg>
